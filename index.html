<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 27th Birthday, Nadhifah!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #4a5568;
            overflow-x: hidden;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 75, 110, 0.15);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 2px solid #fff;
            z-index: 10;
        }
        h1 {
            font-size: 1.6rem;
            color: #ff4b6e;
            margin-bottom: 5px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 20px;
            font-style: italic;
        }
        .image-wrapper {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            background: #eee;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .music-card {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .btn-play {
            background: #ff4b6e;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 75, 110, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-play:hover {
            background: #ff2a54;
            transform: translateY(-2px);
        }
        .btn-play:active {
            transform: translateY(0);
        }
        .status-text {
            font-size: 0.85rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Happy 27th Birthday, Nadhifah Rizky</h1>
        <div class="subtitle">Buka albumnya sambil dengerin ini yaa...</div>

        <!-- Bagian Gambar Desain -->
        <div class="image-wrapper">
            <!-- Nama file gambar disesuaikan dengan screenshot kamu -->
            <img src="foto ayang buat desain web.png" alt="Desain Spesial Nadhifah">
        </div>

        <!-- Bagian Pemutar Musik -->
        <div class="music-card">
            <!-- Nama file lagu disesuaikan dengan screenshot kamu -->
            <audio id="bgMusic" src="Sparkle (Original Version).mp3" loop></audio>
            <button class="btn-play" id="playBtn">▶ PUTAR LAGU</button>
            <p class="status-text" id="status">Klik untuk menemani petualangan 1 tahun kita</p>
        </div>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        const statusText = document.getElementById('status');
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                    playBtn.innerHTML = '⏸ PAUSE LAGU';
                    playBtn.style.background = '#718096';
                    playBtn.style.boxShadow = 'none';
                    statusText.innerText = '🎵 Lagu sedang berputar... Selamat membaca! ✨';
                }).catch(error => {
                    alert('Gagal memutar audio. Pastikan file Sparkle (Original Version).mp3 sudah benar.');
                });
            } else {
                music.pause();
                isPlaying = false;
                playBtn.innerHTML = '▶ PUTAR LAGU';
                playBtn.style.background = '#ff4b6e';
                playBtn.style.boxShadow = '0 4px 15px rgba(255, 75, 110, 0.4)';
                statusText.innerText = 'Lagu dihentikan sementara.';
            }
        });
    </script>
</body>
</html>
